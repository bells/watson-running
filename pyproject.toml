[project]
name = "running_page"
version = "2.5.1"
description = "Data pipeline and TUI for Watson Running."
authors = [
  { name = "Watson" },
  { name = "yihong0618", email = "zouzou0208@gmail.com" },
]
dependencies = [
  "httpx",
  "gpxpy==1.6.2",
  "stravalib==0.10.4",
  "appdirs>=1.4.0",
  "svgwrite>=1.1.9",
  "colour>=0.1.5",
  "s2sphere",
  "arrow",
  "geopy",
  "polyline",
  "sqlalchemy",
  "textual",
  "tzfpy; platform_system != \"Windows\"",
  "timezonefinder; platform_system == \"Windows\"",
  "pyyaml",
  "aiofiles",
  "cloudscraper==1.2.71",
  "tcxreader",
  "rich",
  "lxml",
  "eviltransform",
  "stravaweblib==0.0.10",
  "tenacity",
  "numpy",
  "tzlocal",
  "fit-tool",
  "garmin-fit-sdk",
  "haversine==2.8.0",
  "garth",
  "pycryptodome",
  "duckdb",
  "openai==3.24.0",
  "oauthlib>=4.0.0,<5",
  "cairosvg>=2.9.1",
  "certifi==2026.7.22",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
run_page = "run_page.tui.app:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
packages = ["run_page"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
